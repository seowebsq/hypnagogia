<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Nuke the Whales</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; object-fit: contain; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="c" width="960" height="600"></canvas>
<script>
'use strict';
const W = 960, H = 600;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');

// ---------- state ----------
const player = { x: 140, y: 300, vx: 0, vy: 0, r: 18, inv: 0, weapon: null, wTimer: 0, fireCool: 0 };
let bullets = [], shots = [], whales = [], parts = [], pows = [], bubbles = [];
let score = 0, lives = 3, wave = 0, waveSpawn = 0, toSpawn = 0, boss = null, madT = 0;
let state = 'title'; // title | play | over | win
let quote = '', quoteT = 0, shake = 0, time = 0;
const keys = {};

const QUOTES = [
  'Elke ontploffing is een overwinning voor het milieu.',
  'De walvissen vielen ons eerst aan. Dat weet iedereen.',
  'Dit noemen wij een gecontroleerde ecologische transitie.',
  'Nevenschade bestaat niet. Alleen onverwachte winst.',
  'De oceaan was toch al nat.',
  'Wij vechten voor de vrede van de vissen.',
  'Sonar? Wij noemen het voorlichting.',
];
const DEATH_QUOTES = [
  'Een dappere investering in de voedselketen.',
  'De bemanning wist waar ze aan begon. Wij niet.',
  'Dit telt statistisch gezien niet.',
];
function admiral(t) { quote = t; quoteT = 5; }

// ---------- audio ----------
let AC = null, muted = false;
function audio() { AC ??= new AudioContext(); }
function sfx(type) {
  if (!AC || muted) return;
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.connect(g); g.connect(AC.destination);
  if (type === 'shoot') {
    o.type = 'square'; o.frequency.setValueAtTime(880, t); o.frequency.exponentialRampToValueAtTime(220, t + 0.08);
    g.gain.setValueAtTime(0.05, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
    o.start(t); o.stop(t + 0.1);
  } else if (type === 'boom') {
    o.type = 'sawtooth'; o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(30, t + 0.4);
    g.gain.setValueAtTime(0.18, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
    o.start(t); o.stop(t + 0.45);
  } else if (type === 'pow') {
    o.type = 'square';
    [523, 659, 784, 1047].forEach((f, i) => o.frequency.setValueAtTime(f, t + i * 0.07));
    g.gain.setValueAtTime(0.07, t); g.gain.setValueAtTime(0.001, t + 0.3);
    o.start(t); o.stop(t + 0.3);
  } else if (type === 'hit') {
    o.type = 'triangle'; o.frequency.setValueAtTime(90, t);
    g.gain.setValueAtTime(0.2, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
    o.start(t); o.stop(t + 0.25);
  }
}
// synthwave loop: bass + arp, scheduled ahead
let beat = 0, nextNote = 0;
const BASS = [55, 55, 65.4, 49];           // A1 A1 C2 G1
const ARP = [220, 261.6, 329.6, 440];      // A3 C4 E4 A4
function music() {
  if (!AC || muted) return;
  while (nextNote < AC.currentTime + 0.25) {
    const t = nextNote, b = beat % 16;
    if (b % 4 === 0) { // bass, eighth feel
      const o = AC.createOscillator(), g = AC.createGain(), f = AC.createBiquadFilter();
      o.type = 'sawtooth'; o.frequency.value = BASS[(b / 4) | 0];
      f.type = 'lowpass'; f.frequency.value = 400;
      o.connect(f); f.connect(g); g.connect(AC.destination);
      g.gain.setValueAtTime(0.12, t); g.gain.exponentialRampToValueAtTime(0.01, t + 0.24);
      o.start(t); o.stop(t + 0.25);
    }
    { // arp sixteenths
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = 'square'; o.frequency.value = ARP[b % 4] * (b >= 8 ? 1.5 : 1);
      o.connect(g); g.connect(AC.destination);
      g.gain.setValueAtTime(0.025, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
      o.start(t); o.stop(t + 0.13);
    }
    nextNote += 60 / 110 / 4; beat++;
  }
}
setInterval(music, 100);

// ---------- entities ----------
function spawnWave() {
  wave++;
  if (wave === 5) { spawnBoss(); return; }
  toSpawn = 3 + wave * 2;
  waveSpawn = 0;
  admiral(QUOTES[(Math.random() * QUOTES.length) | 0]);
}
function spawnWhale() {
  const big = Math.random() < 0.2;
  whales.push({
    x: W + 60, y: 80 + Math.random() * (H - 200), r: big ? 42 : 30,
    hp: (big ? 5 : 2) + ((wave / 2) | 0), big,
    px: 500 + Math.random() * 360,                 // patrol column
    ph: Math.random() * 7, shoot: 1 + Math.random() * 2.5,
    hue: 285 + Math.random() * 40,
  });
}
function spawnBoss() {
  boss = { x: W + 200, y: H / 2, r: 95, hp: 150, maxHp: 150, ph: 0, shoot: 2, laserT: 0, laserY: 0, phase: 0 };
  admiral('MOBY DICK CHENEY nadert. Defensiebudget: $600 mld.');
}
function explode(x, y, n, hue) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 40 + Math.random() * 180;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.5 + Math.random() * 0.5, hue: hue ?? 110 });
  }
  shake = Math.min(14, shake + n * 0.4);
  sfx('boom');
}
function dropPow(x, y) {
  if (Math.random() > 0.22) return;
  const kind = ['R', 'D', 'M'][(Math.random() * 3) | 0];
  pows.push({ x, y, kind, t: 0 });
}
function killWhale(w, i) {
  whales.splice(i, 1);
  score += 100 * wave;
  explode(w.x, w.y, 24);
  dropPow(w.x, w.y);
}
function hitPlayer() {
  if (player.inv > 0 || madT > 0) return;
  lives--;
  explode(player.x, player.y, 30, 180);
  sfx('hit');
  admiral(DEATH_QUOTES[(Math.random() * DEATH_QUOTES.length) | 0]);
  if (lives <= 0) { state = 'over'; admiral('Missie volbracht. Stuur de factuur naar de natuur.'); return; }
  player.x = 140; player.y = H / 2; player.inv = 2.5;
  player.weapon = null;
}

// ---------- update ----------
function fire() {
  if (player.fireCool > 0) return;
  const { x, y } = player;
  if (player.weapon === 'R') {               // Reagan Ray: continuous piercing beam, handled in update
    player.fireCool = 0;
  } else if (player.weapon === 'D') {        // Disco Torpedo: 3-way rainbow spread
    for (const a of [-0.22, 0, 0.22])
      bullets.push({ x: x + 20, y, vx: Math.cos(a) * 520, vy: Math.sin(a) * 520, disco: true });
    player.fireCool = 0.18; sfx('shoot');
  } else {
    bullets.push({ x: x + 20, y, vx: 520, vy: 0 });
    player.fireCool = 0.22; sfx('shoot');
  }
}
function update(dt) {
  time += dt;
  if (state !== 'play') return;
  quoteT -= dt; shake = Math.max(0, shake - 40 * dt);
  player.inv -= dt; player.fireCool -= dt;
  if (player.weapon && (player.wTimer -= dt) <= 0) player.weapon = null;

  // player movement
  const sp = 300;
  player.vx = ((keys.ArrowRight || keys.KeyD) ? 1 : 0) - ((keys.ArrowLeft || keys.KeyA) ? 1 : 0);
  player.vy = ((keys.ArrowDown || keys.KeyS) ? 1 : 0) - ((keys.ArrowUp || keys.KeyW) ? 1 : 0);
  player.x = Math.max(30, Math.min(W - 30, player.x + player.vx * sp * dt));
  player.y = Math.max(30, Math.min(H - 60, player.y + player.vy * sp * dt));
  if (keys.Space || keys.KeyX) fire();

  // Reagan Ray: damage everything on the beam line
  if (player.weapon === 'R' && (keys.Space || keys.KeyX)) {
    for (let i = whales.length - 1; i >= 0; i--) {
      const w = whales[i];
      if (w.x > player.x && Math.abs(w.y - player.y) < w.r) {
        w.hp -= 14 * dt;
        if (w.hp <= 0) killWhale(w, i);
      }
    }
    if (boss && boss.x > player.x && Math.abs(boss.y - player.y) < boss.r) boss.hp -= 10 * dt;
    for (let i = shots.length - 1; i >= 0; i--)
      if (shots[i].x > player.x && Math.abs(shots[i].y - player.y) < 10) { explode(shots[i].x, shots[i].y, 4); shots.splice(i, 1); score += 10; }
  }

  // wave spawning
  if (!boss && toSpawn > 0 && (waveSpawn -= dt) <= 0) { waveSpawn = 0.9; toSpawn--; spawnWhale(); }
  if (!boss && toSpawn <= 0 && whales.length === 0) spawnWave();

  // whales
  for (let i = whales.length - 1; i >= 0; i--) {
    const w = whales[i];
    w.ph += dt;
    if (w.x > w.px) w.x -= (60 + wave * 8) * dt;
    w.y += Math.sin(w.ph * 1.6) * 40 * dt;
    if ((w.shoot -= dt) <= 0) {
      w.shoot = 2.2 + Math.random() * 2.5 - wave * 0.1;
      const a = Math.atan2(player.y - w.y, player.x - w.x);
      shots.push({ x: w.x - w.r, y: w.y, vx: Math.cos(a) * 170, vy: Math.sin(a) * 170, hom: 0.9 });
      sfx('shoot');
    }
    if (Math.hypot(w.x - player.x, w.y - player.y) < w.r + player.r) hitPlayer();
  }

  // boss
  if (boss) {
    boss.ph += dt;
    if (boss.x > 740) boss.x -= 70 * dt;
    boss.y = H / 2 + Math.sin(boss.ph * 0.7) * 170;
    const rate = boss.hp < boss.maxHp / 2 ? 1.3 : 2.2;
    if ((boss.shoot -= dt) <= 0) {
      boss.shoot = rate;
      for (const off of [-0.35, 0, 0.35]) {
        const a = Math.atan2(player.y - boss.y, player.x - boss.x) + off;
        shots.push({ x: boss.x - boss.r, y: boss.y, vx: Math.cos(a) * 200, vy: Math.sin(a) * 200, hom: 0.4 });
      }
      sfx('shoot');
    }
    boss.laserT -= dt;
    if (boss.laserT < -6) { boss.laserT = 0.9; boss.laserY = player.y; } // telegraph 0.9s, then fire
    if (boss.laserT > 0 && boss.laserT - dt <= 0) {                     // beam moment
      explode(boss.x - boss.r, boss.laserY, 6, 0);
      if (Math.abs(player.y - boss.laserY) < 26 && player.x < boss.x) hitPlayer();
      boss.laserT = -0.5; // short active flash drawn below
    }
    if (Math.hypot(boss.x - player.x, boss.y - player.y) < boss.r + player.r) hitPlayer();
    if (boss.hp <= 0) {
      explode(boss.x, boss.y, 120, 110); explode(boss.x, boss.y, 60, 300);
      score += 10000; boss = null; state = 'win';
      admiral('Het milieu is eindelijk veilig. Voor ons.');
    }
  }

  // bullets
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.x > W + 20 || b.y < -20 || b.y > H + 20) { bullets.splice(i, 1); continue; }
    let hit = false;
    for (let j = whales.length - 1; j >= 0; j--) {
      const w = whales[j];
      if (Math.hypot(b.x - w.x, b.y - w.y) < w.r) {
        w.hp -= 1; hit = true;
        parts.push({ x: b.x, y: b.y, vx: 60, vy: 0, life: 0.2, hue: 110 });
        if (w.hp <= 0) killWhale(w, j);
        break;
      }
    }
    if (!hit && boss && Math.hypot(b.x - boss.x, b.y - boss.y) < boss.r) { boss.hp -= 1; hit = true; parts.push({ x: b.x, y: b.y, vx: 60, vy: 0, life: 0.2, hue: 110 }); }
    if (!hit) for (let j = shots.length - 1; j >= 0; j--) {
      if (Math.hypot(b.x - shots[j].x, b.y - shots[j].y) < 12) { explode(shots[j].x, shots[j].y, 4); shots.splice(j, 1); score += 10; hit = true; break; }
    }
    if (hit) bullets.splice(i, 1);
  }

  // enemy missiles (slightly homing)
  for (let i = shots.length - 1; i >= 0; i--) {
    const s = shots[i];
    if (s.hom) {
      const a = Math.atan2(player.y - s.y, player.x - s.x);
      const cur = Math.atan2(s.vy, s.vx);
      let d = a - cur; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI;
      const na = cur + Math.max(-s.hom * dt, Math.min(s.hom * dt, d));
      const v = Math.hypot(s.vx, s.vy);
      s.vx = Math.cos(na) * v; s.vy = Math.sin(na) * v;
    }
    s.x += s.vx * dt; s.y += s.vy * dt;
    if (s.x < -30 || s.x > W + 30 || s.y < -30 || s.y > H + 30) { shots.splice(i, 1); continue; }
    if (Math.hypot(s.x - player.x, s.y - player.y) < player.r + 6) { shots.splice(i, 1); hitPlayer(); }
  }

  // powerups
  for (let i = pows.length - 1; i >= 0; i--) {
    const p = pows[i];
    p.t += dt; p.y += Math.sin(p.t * 3) * 20 * dt; p.x -= 40 * dt;
    if (p.x < -20) { pows.splice(i, 1); continue; }
    if (Math.hypot(p.x - player.x, p.y - player.y) < player.r + 14) {
      pows.splice(i, 1); sfx('pow');
      if (p.kind === 'M') {               // Mutually Assured Disco
        madT = 1.6;
        admiral('MUTUALLY ASSURED DISCO. Iedereen danst. Niemand wint.');
        for (let j = whales.length - 1; j >= 0; j--) { score += 100 * wave; explode(whales[j].x, whales[j].y, 18, (j * 40) % 360); }
        whales.length = 0; shots.length = 0;
        if (boss) { boss.hp -= 30; explode(boss.x, boss.y, 30, 300); }
      } else {
        player.weapon = p.kind; player.wTimer = 9;
        admiral(p.kind === 'R' ? 'REAGAN RAY: vertrouw ons, het is wetenschap.' : 'DISCO TORPEDO: drie keer raak, één keer funky.');
      }
    }
  }
  madT -= dt;

  // particles & bubbles
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy -= 30 * dt; p.life -= dt;
    if (p.life <= 0) parts.splice(i, 1);
  }
  if (Math.random() < dt * 8) bubbles.push({ x: Math.random() * W, y: H + 10, s: 2 + Math.random() * 4, v: 25 + Math.random() * 40 });
  for (let i = bubbles.length - 1; i >= 0; i--) { bubbles[i].y -= bubbles[i].v * dt; if (bubbles[i].y < -10) bubbles.splice(i, 1); }
}

// ---------- drawing ----------
function neon(color, blur) { ctx.shadowColor = color; ctx.shadowBlur = blur; }
function drawBG() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#3d0a5e'); g.addColorStop(0.45, '#8e1370'); g.addColorStop(0.55, '#ff2d95'); g.addColorStop(0.62, '#4a0d55'); g.addColorStop(1, '#14032b');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // synth sun, drowned
  neon('#ff9e2d', 40);
  ctx.fillStyle = '#ffb02d';
  ctx.beginPath(); ctx.arc(W / 2, H * 0.52, 90, Math.PI, 0); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#8e1370';
  for (let i = 0; i < 5; i++) ctx.fillRect(W / 2 - 95, H * 0.52 - 12 - i * 16, 190, 5 + i);
  // grid floor
  ctx.strokeStyle = 'rgba(255,45,149,0.5)'; ctx.lineWidth = 1.5;
  for (let i = 0; i <= 12; i++) {
    const x = (i / 12) * W;
    ctx.beginPath(); ctx.moveTo(W / 2 + (x - W / 2) * 0.25, H * 0.62); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let i = 0; i < 6; i++) {
    const y = H * 0.62 + (i / 5) ** 2 * (H * 0.38);
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  // light shafts
  ctx.fillStyle = 'rgba(255,255,255,0.045)';
  for (let i = 0; i < 4; i++) {
    const x = ((i * 290 + time * 12) % (W + 300)) - 150;
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + 90, 0); ctx.lineTo(x - 60, H); ctx.lineTo(x - 150, H); ctx.fill();
  }
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  for (const b of bubbles) { ctx.beginPath(); ctx.arc(b.x, b.y, b.s, 0, 7); ctx.fill(); }
}
function drawSub() {
  if (player.inv > 0 && state === 'play' && ((time * 10) | 0) % 2) return; // blink
  const { x, y } = player;
  neon('#2de8ff', 18);
  ctx.fillStyle = '#19c8e6';
  ctx.beginPath(); ctx.ellipse(x, y, 24, 12, 0, 0, 7); ctx.fill();
  ctx.fillRect(x - 6, y - 20, 5, 10);                         // periscope
  ctx.beginPath(); ctx.moveTo(x - 24, y); ctx.lineTo(x - 36, y - 10); ctx.lineTo(x - 36, y + 10); ctx.fill(); // tail fin
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#063a4a';
  ctx.beginPath(); ctx.arc(x + 8, y - 2, 4, 0, 7); ctx.fill(); // porthole
  if (player.weapon === 'R' && (keys.Space || keys.KeyX) && state === 'play') {
    neon('#ff4040', 22);
    const g = ctx.createLinearGradient(x, 0, W, 0);
    g.addColorStop(0, 'rgba(255,80,80,0.95)'); g.addColorStop(1, 'rgba(255,80,80,0.4)');
    ctx.fillStyle = g; ctx.fillRect(x + 20, y - 4, W - x, 8);
    ctx.shadowBlur = 0;
  }
}
function drawWhale(w, isBoss) {
  const flap = Math.sin(w.ph * 5) * 0.4;
  neon(isBoss ? '#b0b8c8' : `hsl(${w.hue}, 90%, 60%)`, 16);
  ctx.fillStyle = isBoss ? '#78808f' : `hsl(${w.hue}, 70%, 48%)`;
  ctx.beginPath(); ctx.ellipse(w.x, w.y, w.r * 1.25, w.r * 0.72, 0, 0, 7); ctx.fill();
  // tail
  ctx.beginPath();
  ctx.moveTo(w.x + w.r * 1.15, w.y);
  ctx.lineTo(w.x + w.r * 1.8, w.y - w.r * (0.55 + flap));
  ctx.lineTo(w.x + w.r * 1.8, w.y + w.r * (0.55 - flap));
  ctx.fill();
  ctx.shadowBlur = 0;
  // robot panel + rivets
  ctx.strokeStyle = 'rgba(0,0,0,0.45)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(w.x - w.r * 0.9, w.y + w.r * 0.1); ctx.lineTo(w.x + w.r * 0.9, w.y + w.r * 0.1); ctx.stroke();
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.arc(w.x + i * w.r * 0.4, w.y + w.r * 0.3, 2.5, 0, 7); ctx.fill(); }
  // red robot eye
  neon('#ff2020', 12);
  ctx.fillStyle = '#ff3030';
  ctx.beginPath(); ctx.arc(w.x - w.r * 0.8, w.y - w.r * 0.15, isBoss ? 9 : 5, 0, 7); ctx.fill();
  ctx.shadowBlur = 0;
  if (isBoss) { // monocle + dollar blowhole
    ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(w.x - w.r * 0.8, w.y - w.r * 0.15, 15, 0, 7); ctx.stroke();
    ctx.fillStyle = '#9fffb0'; ctx.font = 'bold 22px monospace'; ctx.textAlign = 'center';
    ctx.fillText('$', w.x - w.r * 0.2, w.y - w.r * 0.55);
  }
}
function drawHUD() {
  ctx.textAlign = 'left'; ctx.font = 'bold 18px monospace';
  neon('#2de8ff', 8); ctx.fillStyle = '#aef6ff';
  ctx.fillText('SCORE ' + score, 16, 28);
  ctx.fillText('GOLF ' + wave, 16, 52);
  ctx.fillStyle = '#ff6e9e';
  ctx.fillText('LEVENS ' + '♥'.repeat(Math.max(0, lives)), 16, 76);
  if (player.weapon) {
    ctx.fillStyle = '#9fffb0';
    ctx.fillText((player.weapon === 'R' ? 'REAGAN RAY ' : 'DISCO TORPEDO ') + Math.ceil(player.wTimer), 16, 100);
  }
  ctx.shadowBlur = 0;
  if (boss) { // defensiebudget bar
    ctx.textAlign = 'center'; ctx.font = 'bold 14px monospace';
    ctx.fillStyle = '#fff'; ctx.fillText('MOBY DICK CHENEY — DEFENSIEBUDGET: $' + Math.max(0, Math.ceil(boss.hp * 4)) + ' MLD', W / 2, 24);
    ctx.fillStyle = '#400'; ctx.fillRect(W / 2 - 200, 32, 400, 12);
    ctx.fillStyle = '#ffd700'; ctx.fillRect(W / 2 - 200, 32, 400 * Math.max(0, boss.hp / boss.maxHp), 12);
  }
  if (quoteT > 0) {
    ctx.textAlign = 'center'; ctx.font = 'bold 17px monospace';
    ctx.fillStyle = `rgba(255,230,160,${Math.min(1, quoteT)})`;
    ctx.fillText('ADMIRAAL: “' + quote + '”', W / 2, H - 24);
  }
}
function drawOverlay(title, sub1, sub2) {
  ctx.fillStyle = 'rgba(10,0,25,0.72)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  neon('#ff2d95', 30);
  ctx.fillStyle = '#ff5db1'; ctx.font = 'bold 54px monospace';
  ctx.fillText(title, W / 2, H / 2 - 60);
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#aef6ff'; ctx.font = '20px monospace';
  ctx.fillText(sub1, W / 2, H / 2 - 10);
  ctx.fillStyle = '#ffe6a0'; ctx.font = '17px monospace';
  ctx.fillText(sub2, W / 2, H / 2 + 28);
  ctx.fillStyle = '#9fffb0'; ctx.font = 'bold 20px monospace';
  ctx.fillText(state === 'title' ? 'DRUK OP ENTER' : 'ENTER = OPNIEUW', W / 2, H / 2 + 90);
}
function draw() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  drawBG();
  // powerups
  for (const p of pows) {
    neon('#9fffb0', 14);
    ctx.fillStyle = p.kind === 'M' ? `hsl(${(time * 300) % 360},90%,65%)` : '#39e87a';
    ctx.beginPath(); ctx.arc(p.x, p.y, 13, 0, 7); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#06260e'; ctx.font = 'bold 15px monospace'; ctx.textAlign = 'center';
    ctx.fillText(p.kind, p.x, p.y + 5);
  }
  // bullets
  for (const b of bullets) {
    neon(b.disco ? `hsl(${(time * 500) % 360},100%,60%)` : '#2de8ff', 10);
    ctx.fillStyle = b.disco ? `hsl(${(time * 500) % 360},100%,70%)` : '#bdf6ff';
    ctx.fillRect(b.x - 8, b.y - 2, 16, 4);
  }
  // enemy missiles
  for (const s of shots) {
    neon('#ff4040', 12);
    ctx.fillStyle = '#ff7050';
    ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(Math.atan2(s.vy, s.vx));
    ctx.fillRect(-9, -3, 18, 6);
    ctx.fillStyle = '#ffd040'; ctx.fillRect(-13, -2, 4, 4); // exhaust
    ctx.restore();
  }
  ctx.shadowBlur = 0;
  for (const w of whales) drawWhale(w, false);
  if (boss) {
    drawWhale(boss, true);
    if (boss.laserT > 0) { // telegraph line
      ctx.strokeStyle = `rgba(255,60,60,${0.3 + 0.5 * Math.sin(time * 30)})`; ctx.lineWidth = 3;
      ctx.setLineDash([12, 10]);
      ctx.beginPath(); ctx.moveTo(0, boss.laserY); ctx.lineTo(boss.x - boss.r, boss.laserY); ctx.stroke();
      ctx.setLineDash([]);
    } else if (boss.laserT > -0.5) { // active beam flash
      neon('#ff3030', 25); ctx.fillStyle = 'rgba(255,70,70,0.9)';
      ctx.fillRect(0, boss.laserY - 12, boss.x - boss.r, 24);
      ctx.shadowBlur = 0;
    }
  }
  drawSub();
  // toxic green particles
  for (const p of parts) {
    neon(`hsl(${p.hue},100%,60%)`, 12);
    ctx.fillStyle = `hsla(${p.hue},100%,62%,${Math.min(1, p.life * 2)})`;
    ctx.beginPath(); ctx.arc(p.x, p.y, 3.2, 0, 7); ctx.fill();
  }
  ctx.shadowBlur = 0;
  // Mutually Assured Disco
  if (madT > 0) {
    ctx.fillStyle = `hsla(${(time * 700) % 360},100%,60%,0.16)`; ctx.fillRect(0, 0, W, H);
    neon('#fff', 30); ctx.fillStyle = '#e8e8f8';
    ctx.beginPath(); ctx.arc(W / 2, 110, 34, 0, 7); ctx.fill();
    ctx.shadowBlur = 0;
    for (let i = 0; i < 10; i++) { // mirror ball rays
      const a = i / 10 * Math.PI * 2 + time * 3;
      ctx.strokeStyle = `hsla(${i * 36},100%,65%,0.5)`; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(W / 2, 110); ctx.lineTo(W / 2 + Math.cos(a) * 900, 110 + Math.sin(a) * 900); ctx.stroke();
    }
  }
  drawHUD();
  if (state === 'title') drawOverlay('NUKE THE WHALES', 'pijltjes/WASD = sturen · spatie = vuren', 'Red de oceaan. Van de walvissen. Met kernwapens.');
  if (state === 'over') drawOverlay('GAME OVER', 'SCORE: ' + score, 'ADMIRAAL: “Missie volbracht. Stuur de factuur naar de natuur.”');
  if (state === 'win') drawOverlay('OVERWINNING', 'SCORE: ' + score, 'Het milieu is eindelijk veilig. Voor ons.');
  ctx.restore();
  // CRT: scanlines + vignette + flicker
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  for (let y = 0; y < H; y += 3) ctx.fillRect(0, y, W, 1);
  const v = ctx.createRadialGradient(W / 2, H / 2, H / 3, W / 2, H / 2, H * 0.95);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  if (((time * 60) | 0) % 47 === 0) { ctx.fillStyle = 'rgba(255,255,255,0.03)'; ctx.fillRect(0, 0, W, H); }
}

// ---------- input & loop ----------
function reset() {
  score = 0; lives = 3; wave = 0; toSpawn = 0;
  bullets = []; shots = []; whales = []; pows = []; boss = null; madT = 0;
  player.x = 140; player.y = H / 2; player.inv = 2; player.weapon = null;
  state = 'play';
  spawnWave();
}
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  audio();
  if (e.code === 'Enter' && state !== 'play') reset();
  if (e.code === 'KeyP' && state === 'play') state = 'pause';
  else if (e.code === 'KeyP' && state === 'pause') state = 'play';
  if (e.code === 'KeyN') muted = !muted;
});
addEventListener('keyup', e => keys[e.code] = false);
addEventListener('pointerdown', () => { audio(); if (state !== 'play' && state !== 'pause') reset(); });

let last = 0;
function loop(t) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (t - last) / 1000 || 0.016);
  last = t;
  if (state !== 'pause') update(dt);
  draw();
  if (state === 'pause') {
    ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.font = 'bold 30px monospace';
    ctx.fillText('PAUZE', W / 2, H / 2);
  }
}
requestAnimationFrame(loop);

// ponytail: console-test handle — frame-independent stepping
window.DBG = {
  player, get whales() { return whales; }, get boss() { return boss; }, get shots() { return shots; },
  get pows() { return pows; }, get state() { return state; }, set state(s) { state = s; },
  get score() { return score; }, get lives() { return lives; }, get wave() { return wave; },
  keys, reset, spawnBoss: () => { whales.length = 0; toSpawn = 0; spawnBoss(); },
  pow(kind) { pows.push({ x: player.x + 1, y: player.y, kind, t: 0 }); },
  step(n, dt = 1 / 60) { for (let i = 0; i < n; i++) update(dt); },
  get quote() { return quote; },
};
</script>
